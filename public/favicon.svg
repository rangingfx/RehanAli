<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Background with industrial chamfer/rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#metalGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.35" stroke-dasharray="16 8"/>

  <!-- Mechanical multi-head embroidery guide ring / stitch hoop circle -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#334155" stroke-width="12"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="4 8"/>

  <!-- Needle and thread passing through eye -->
  <!-- Industrial Needle shaft -->
  <path d="M 256 70 L 270 120 L 264 360 L 256 430 L 248 360 L 242 120 Z" fill="url(#needleGrad)"/>
  <!-- Needle Eye -->
  <ellipse cx="256" cy="380" rx="4" ry="16" fill="#0F172A"/>

  <!-- Vibrant Gold Embroidery Thread running fluidly through needle eye -->
  <path d="M 120 280 C 180 280, 240 370, 256 380 C 272 390, 340 320, 390 340" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Monogram text RA -->
  <text x="256" y="260" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" letter-spacing="-2">RA</text>
  <text x="256" y="475" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#F59E0B" letter-spacing="4">REHAN ALI</text>
</svg>
